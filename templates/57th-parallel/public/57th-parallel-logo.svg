<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none" role="img" aria-label="57th Parallel">
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- 57° hero mark -->
    <text x="0" y="42" font-weight="700" font-size="44" fill="currentColor" letter-spacing="-0.04em">57</text>
    <text x="62" y="20" font-weight="500" font-size="22" fill="#0891b2">°</text>
    <!-- PARALLEL institutional wordmark, P aligned under ° -->
    <text x="62" y="40" font-weight="600" font-size="13" fill="currentColor" letter-spacing="0.4em">PARALLEL</text>
  </g>
</svg>
